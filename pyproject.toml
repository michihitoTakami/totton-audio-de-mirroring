[project]
name = "totton-audio-de-mirroring"
version = "0.1.0"
description = "Constrained adaptive FIR upsampling with worst-case audio gates"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Michihito Takami" }
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "tensorboard>=2.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
totton-upsample = "totton_audio_de_mirroring.cli:main"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["totton_audio_de_mirroring"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_optional = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "librosa.*",
    "scipy.*",
    "soundfile.*",
    "matplotlib.*",
    "tensorboard.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-v", "--tb=short", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU (deselect with '-m \"not gpu\"')",
]
