# Linear-phase HiRate FIR design for the CAPB Stage 2 8x transport cascade.
# The effective kernels match Totton Audio NN's Kaiser beta=16 design.

[stage1]
# 88.2kHz -> 176.4kHz. Cutoff is the stage input Nyquist.
design_kind=hirate_linear
sample_rate_hz=176400
passband_hz=20000
stopband_hz=68200
cutoff_hz=44100
attenuation_db=140
passband_ripple_db=0.001
overshoot_max=0.05
pre_echo_ms_max=0.1
post_ringing_ms_max=2.0
num_taps=255
taps_path=cpp/configs/stage1_taps.txt

[stage2]
# 176.4kHz -> 352.8kHz.
design_kind=hirate_linear
sample_rate_hz=352800
passband_hz=20000
stopband_hz=156400
cutoff_hz=88200
attenuation_db=140
passband_ripple_db=0.001
overshoot_max=0.05
pre_echo_ms_max=0.1
post_ringing_ms_max=2.0
num_taps=63
taps_path=cpp/configs/stage2_taps.txt

[stage3]
# 352.8kHz -> 705.6kHz.
design_kind=hirate_linear
sample_rate_hz=705600
passband_hz=20000
stopband_hz=332800
cutoff_hz=176400
attenuation_db=140
passband_ripple_db=0.001
overshoot_max=0.05
pre_echo_ms_max=0.1
post_ringing_ms_max=2.0
num_taps=39
taps_path=cpp/configs/stage3_taps.txt
