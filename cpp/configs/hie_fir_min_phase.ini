# Minimum-phase FIR design for HIE (Stage 2) 2x upsampling stages.
# Aim: preserve black background (stopband attenuation) while minimizing post-ringing.

[stage1]
# 88.2kHz -> 176.4kHz
sample_rate_hz=176400
passband_hz=45000
stopband_hz=65000
attenuation_db=60
passband_ripple_db=0.6
overshoot_max=0.25
pre_echo_ms_max=0.1
post_ringing_ms_max=1.0
min_taps=17
max_taps=255
num_taps=0
# Output taps file (one coefficient per line)
taps_path=cpp/configs/stage1_taps.txt

[stage2]
# 176.4kHz -> 352.8kHz
sample_rate_hz=352800
passband_hz=45000
stopband_hz=90000
attenuation_db=60
passband_ripple_db=0.6
overshoot_max=0.25
pre_echo_ms_max=0.1
post_ringing_ms_max=1.0
min_taps=17
max_taps=255
num_taps=0
taps_path=cpp/configs/stage2_taps.txt

[stage3]
# 352.8kHz -> 705.6kHz
sample_rate_hz=705600
passband_hz=45000
stopband_hz=120000
attenuation_db=60
passband_ripple_db=0.6
overshoot_max=0.25
pre_echo_ms_max=0.1
post_ringing_ms_max=1.0
min_taps=17
max_taps=255
num_taps=0
taps_path=cpp/configs/stage3_taps.txt
