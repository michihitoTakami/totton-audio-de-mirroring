# Stage2 quality benchmark configuration for Issue #44.
# Metrics target: pre-echo < 0.1ms, step overshoot < 5%.

[benchmark]
source_sample_rate_hz=88200
impulse_length=4096
step_length=4096
transition_index=512
settle_fraction=0.75
reference_quantile=0.95
pre_echo_threshold_ratio=0.001
max_pre_echo_ms=0.1
max_step_overshoot_ratio=0.05
