# Pre-commit hooks for totton-audio-de-mirroring
#
# Install hooks:
#   uv run pre-commit install
#   uv run pre-commit install --hook-type pre-push
#
# Run all (manually):
#   uv run pre-commit run --all-files

default_language_version:
  python: python3

repos:
  # clang-format for C/C++ formatting
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^cpp/.*\.(c|cpp|h|hpp)$

  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10240']  # 10MB limit
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff: Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Type checking with mypy (pre-push only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        stages: [pre-push]
        additional_dependencies:
          - numpy>=1.24
          - scipy>=1.11
          - torch>=2.5.0
        args: [--config-file=pyproject.toml, src/]
        pass_filenames: false

  # Unit tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        stages: [pre-push]
        entry: uv run --extra dev pytest
        language: system
        args: [-m, "not slow and not gpu", --tb=short]
        pass_filenames: false
        always_run: true

  # C++ build preparation for clang-tidy (pre-push)
  - repo: local
    hooks:
      - id: prepare-cpp-build
        name: Prepare C++ build (compile_commands.json)
        entry: bash -c '"${CMAKE_BIN:-/usr/bin/cmake}" -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
        language: system
        files: ^cpp/.*\.(c|cpp|h|hpp)$
        pass_filenames: false
        stages: [pre-push]

  # clang-tidy for C++ static analysis (pre-push)
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: v1.3.5
    hooks:
      - id: clang-tidy
        args: [-p=cpp/build]
        files: ^cpp/.*\.(c|cpp)$
        stages: [pre-push]

  # C++ build + tests (pre-push)
  - repo: local
    hooks:
      - id: cpp-tests
        name: Build and run C++ tests
        entry: |
          bash -c '
            set -euo pipefail
            "${CMAKE_BIN:-/usr/bin/cmake}" -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            "${CMAKE_BIN:-/usr/bin/cmake}" --build cpp/build --parallel
            /usr/bin/ctest --test-dir cpp/build --output-on-failure
          '
        language: system
        files: ^cpp/.*\.(c|cpp|h|hpp)$
        pass_filenames: false
        stages: [pre-push]
