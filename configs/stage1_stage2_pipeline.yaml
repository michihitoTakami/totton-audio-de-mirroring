pipeline:
  source_sample_rate: 44100
  stage1_sample_rate: 88200
  output_sample_rate: 705600
  stage2_config_dir: cpp/configs
  stage2_num_stages: 3
  stage2_backend: cpp
  stage2_cpp_project_dir: cpp
  stage2_cpp_build_dir: cpp/build
  chunk_duration_sec: 0.25
  overlap_ratio: 0.5
  chunk_window: hann
  stage1_energy_cap: 0.001
  evaluate_stage1_metrics: true

stage1:
  mode: reference
