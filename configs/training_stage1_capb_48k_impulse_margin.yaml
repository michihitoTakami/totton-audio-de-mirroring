# CAPB 48 kHz final impulse-gain margin phase.

epochs: 8
batch_size: 16
learning_rate: 1.0e-5
weight_decay: 0.0
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
seed: 1234
border_trim: 512
checkpoint_dir: data/checkpoints/capb_48k
checkpoint_interval_epochs: 1
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  plateau: 0.0
  quiet: 0.0
  tv: 0.1
  entropy_floor: 10.0
  min_entropy: 0.05
  edge_fidelity_relax: 0.0
  edge_ring: 0.0
  pre_echo_excess: 0.0
  stationary_modulation: 0.0
  prototype_routing: 0.0
