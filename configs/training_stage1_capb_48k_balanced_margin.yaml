# One strict-FP32 balanced margin epoch for a screened 48 kHz candidate.
#
# The parent checkpoint and the output directory are not pinned here: pass
# --init-checkpoint and --checkpoint-dir on the command line.

epochs: 1
batch_size: 16
learning_rate: 5.0e-7
weight_decay: 1.0e-3
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
device: cuda
seed: 1234
allow_tf32: false
deterministic: false
initial_head_scale: 1.0
border_trim: 512
checkpoint_dir: data/checkpoints/experiments/capb_48k_balanced_margin
checkpoint_interval_epochs: 1
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  plateau: 600.0
  quiet: 600.0
  tv: 0.1
  entropy_floor: 10.0
  min_entropy: 0.05
  edge_fidelity_relax: 0.9
  edge_ring: 0.03
  pre_echo_excess: 3000.0
  stationary_modulation: 3000.0
  prototype_routing: 2.0
