# CAPB 48 kHz curriculum for continuous-sweep boundary coverage.
#
# Random chunk positions expose the controller to both low-frequency sweep
# onsets and high-frequency sweep tails. This prevents zero padding at an
# inference boundary from being mistaken for a broadband transient while the
# frozen prototype bank remains the only waveform-producing component.

num_samples: 10000
source_duration_sec: 1.0
chunk_duration_sec: 0.25
random_chunk: true
seed: 1234

source_sample_rate: 48000
target_sample_rate: 96000

brickwall:
  passband_edge_hz: 23700.0
  stopband_edge_hz: 24000.0
  attenuation_db: 120.0

near_nyquist_high_range_hz: [20000.0, 23400.0]
flat_mask_window_ms: 0.10

signal_mix:
  sweep_log: 0.35
  sweep_linear: 0.25
  pink_noise: 0.10
  near_nyquist_noise: 0.10
  imd_two_tone: 0.10
  square_wave: 0.05
  isolated_click: 0.03
  tone_burst: 0.02

augmentation:
  gain_range: [0.25, 1.0]
  polarity_flip_prob: 0.3
  noise_std_range: [0.0, 0.001]
  soft_clip_prob: 0.1
  soft_clip_drive_range: [1.2, 2.0]

transient_supervision:
  enabled: true
  focus_signal_types: [isolated_click, tone_burst]
  clean_probability: 0.7
  center_fraction_range: [0.2, 0.8]
  context_ms: 5.0
  pre_echo_guard_ms: 0.5
  pre_echo_window_ms: 3.5
  edge_supervision_signal_types: [square_wave, isolated_click]
