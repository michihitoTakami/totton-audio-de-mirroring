# CAPB Stage 1 training data configuration, 48k family (teacher policy:
# capb_bl_96k).
#
# Teacher: native 96 kHz synthesis, band-limited below the input Nyquist
# (24 kHz) with a near-brickwall linear-phase FIR. Input: exact 2:1
# decimation of the target (alias-free, phase-true). Identical recipe to the
# 44.1k config except for the rate constants and the band edges that scale
# with the input Nyquist; audible-band (absolute) parameters are unchanged.

num_samples: 10000
source_duration_sec: 1.0
chunk_duration_sec: 0.25
random_chunk: true
seed: 1234

source_sample_rate: 48000
target_sample_rate: 96000

# Brickwall edges scale with the new input Nyquist (24 kHz); the 300 Hz
# transition width matches the 44.1k config's design margin.
brickwall:
  passband_edge_hz: 23700.0
  stopband_edge_hz: 24000.0
  attenuation_db: 120.0

# Near-Nyquist noise high edge tops out at 97.5% of the 24 kHz input
# Nyquist (same fraction as the 44.1k config's 21.5 kHz).
near_nyquist_high_range_hz: [20000.0, 23400.0]

# Align the plateau-mask edge exclusion with the gate's 0.1 ms plateau
# start. At 48k the mid prototype's settling tail lands in the 0.10-0.15 ms
# zone; with the 44.1k default (0.15 ms) that zone is invisible to the
# plateau loss but measured by the G1 gate (run2 failed exactly there).
flat_mask_window_ms: 0.10

# Edge-rich families (~30%) cover the ringing-gate probe distribution;
# tonal/steady families train mirror suppression; music-like mixtures close
# the domain gap to real audio without real audio. Identical to 44.1k.
signal_mix:
  square_wave: 0.10
  step_plateau: 0.10
  isolated_click: 0.05
  sawtooth_wave: 0.05
  tone_burst: 0.10
  music_like_mixture: 0.15
  multitone: 0.10
  sweep_log: 0.05
  sweep_linear: 0.03
  am_tone: 0.05
  fm_tone: 0.05
  percussive: 0.05
  pink_noise: 0.04
  band_limited_noise: 0.04
  near_nyquist_noise: 0.04

augmentation:
  gain_range: [0.25, 1.0]
  polarity_flip_prob: 0.3
  noise_std_range: [0.0, 0.001]
  soft_clip_prob: 0.1
  soft_clip_drive_range: [1.2, 2.0]
