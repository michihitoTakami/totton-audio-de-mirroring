# Relearn 48 kHz routing from run10 with a smaller desaturation step.

epochs: 10
batch_size: 16
learning_rate: 1.0e-5
weight_decay: 1.0e-3
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
device: cuda
seed: 1234
allow_tf32: false
deterministic: false
initial_head_scale: 0.85
border_trim: 512
checkpoint_dir: data/checkpoints/capb_48k/run12_candidate_relearn_085
initial_checkpoint: data/checkpoints/capb_48k/run10_stationary_20260829/capb_best.pt
checkpoint_interval_epochs: 1
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  plateau: 600.0
  quiet: 600.0
  tv: 0.1
  entropy_floor: 10.0
  min_entropy: 0.05
  edge_fidelity_relax: 0.9
  edge_ring: 0.03
  pre_echo_excess: 300.0
  stationary_modulation: 3000.0
  prototype_routing: 0.3
