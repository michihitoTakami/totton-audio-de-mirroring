# CAPB Stage 1 training configuration, 48k family (48 kHz -> 96 kHz).
#
# Direct copy of the 44.1k run9 recipe (training_stage1_capb.yaml): the
# controller and losses are rate-agnostic (ms-based windows), so only the
# checkpoint directory differs. Only the ~10^5-parameter controller trains;
# the prototype bank (48k preset) is frozen DSP.

epochs: 50
batch_size: 16
learning_rate: 1.0e-4
# Non-zero weight decay keeps controller logits away from softmax
# saturation (run1 collapsed to always-sharp with frozen gradients).
weight_decay: 1.0e-3
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
seed: 1234
border_trim: 512
checkpoint_dir: data/checkpoints/capb_48k
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  # Doubled vs the 44.1k run9 recipe (300): the 48k prototypes ring less in
  # absolute terms, which weakens the plateau gradient against the fidelity
  # terms; run1 (300) left ~4% mid leakage at edges and failed G1 p2p.
  plateau: 600.0
  quiet: 600.0
  tv: 0.1
  entropy_floor: 10.0
  # Entropy floor threshold: 0.05 nats allows ~99% blend purity. The
  # residual 3-4% sharp leakage at 0.15 nats was the remaining G1 p2p
  # excess in run7.
  min_entropy: 0.05
  # Fidelity relaxation inside broadband-transient zones (edge_mask): the
  # brickwall teacher rings there, and reproducing that ringing is exactly
  # what the plateau/quiet gates forbid.
  edge_fidelity_relax: 0.9
  # Edge-zone ripple above the gentle prototype's level. Disabled for v1:
  # with slope-spike edge detection off (see capb_dataset), the remaining
  # edge zones are already covered by the plateau/quiet losses.
  edge_ring: 0.0
