# CAPB 48 kHz stationary-modulation warm-up, initialized from run9.
#
# This phase removes the initial entropy barrier and strengthens the plateau
# objective before the lower-weight final fine-tuning phase.

epochs: 20
batch_size: 16
learning_rate: 2.0e-5
weight_decay: 1.0e-3
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
seed: 1234
border_trim: 512
checkpoint_dir: data/checkpoints/capb_48k/run10_stationary_warmup_20260829
initial_checkpoint: data/checkpoints/capb_48k/run9_retrain_20260829/capb_best.pt
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  plateau: 3000.0
  quiet: 600.0
  tv: 0.1
  stationary_modulation: 30.0
  entropy_floor: 0.0
  min_entropy: 0.0
  edge_fidelity_relax: 0.9
  edge_ring: 0.0
