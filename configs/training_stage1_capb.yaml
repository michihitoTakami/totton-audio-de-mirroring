# CAPB Stage 1 training configuration.
#
# Only the ~10^5-parameter controller trains; the prototype bank is frozen
# DSP. plateau/quiet weights are the differentiable ringing gates and
# intentionally oppose wave/stft fidelity at edges.

epochs: 50
batch_size: 16
learning_rate: 1.0e-4
# Non-zero weight decay keeps controller logits away from softmax
# saturation (run1 collapsed to always-sharp with frozen gradients).
weight_decay: 1.0e-3
grad_clip: 1.0
val_fraction: 0.1
num_workers: 4
seed: 1234
border_trim: 512
checkpoint_dir: data/checkpoints/capb
checkpoint_interval_epochs: 5
log_interval: 20

loss_weights:
  wave: 1.0
  stft: 1.0
  plateau: 300.0
  quiet: 300.0
  tv: 0.1
  entropy_floor: 10.0
  # Entropy floor threshold: 0.05 nats allows ~99% blend purity. The
  # residual 3-4% sharp leakage at 0.15 nats was the remaining G1 p2p
  # excess in run7.
  min_entropy: 0.05
  # Fidelity relaxation inside broadband-transient zones (edge_mask): the
  # brickwall teacher rings there, and reproducing that ringing is exactly
  # what the plateau/quiet gates forbid.
  edge_fidelity_relax: 0.9
  # Edge-zone ripple above the gentle prototype's level. This light default
  # complements the stronger gate-window and routing supervision below.
  edge_ring: 0.3
  # Gate-aligned transient energy above the gentle prototype. The final
  # coefficient is selected by worst-probe screening, never training loss.
  pre_echo_excess: 300.0
  stationary_modulation: 30.0
  prototype_routing: 0.1
