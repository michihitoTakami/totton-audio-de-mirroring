# Stage 1b (Neural Bandwidth Extension) data config — HB GENERATION target.
#
# Same raw_88k2 native-teacher pipeline as Stage 1, but the dataset is used with
# target_mode="generate": the high-band target is the FULL real native high band
# (envelope/energy-cap shaped, NOT capped to the degraded input), so the model
# learns to recreate >22.05kHz content instead of only suppressing.
#
# Usage:
#   uv run python scripts/train_stage1b_generation.py \
#     --data-config configs/data_generation_gen88k2.yaml \
#     --hires-root data/hires_corpus --energy-cap 1e-2

num_samples: 10000
source_sample_rate: 44100
target_sample_rate: 88200
source_duration_sec: 1.0
chunk_duration_sec: 0.25
random_chunk: true
seed: 1234
teacher_type: raw_88k2

signal_sampling:
  signal_types:
    - multitone
    - sweep_linear
    - sweep_log
    - percussive
    - am_tone
    - fm_tone
    - soft_clipped_tone

augmentation:
  gain_range: [0.7, 1.0]
  polarity_flip_prob: 0.3
  noise_std_range: [0.0, 0.002]
  soft_clip_prob: 0.2
  soft_clip_drive_range: [1.2, 2.5]

degradation:
  cutoff_hz_range: [18000.0, 22000.0]
  phase_modes: [analog]
  quantization_bits: [16, 24]
  dither_modes: [none, rectangular, triangular]
  methods:
    - iir_bessel
  iir_order: 6

band_split:
  cutoff_hz: 20000.0
  sample_rate: 88200
  num_taps: 4097
  window: hamming

mirror_detection:
  cutoff_hz: 20000.0
  mirror_center_hz: null
  mirror_band_hz: [20000.0, 22050.0]
  n_fft: 2048
  hop_length: 512
  window: hann
  magnitude_threshold: 3.0
  symmetry_threshold: 0.6

hb_target:
  suppression_floor: 0.2
  energy_cap: 0.01
  envelope_min: 0.2

stage1_path:
  input_route: source_chunk_44k1_to_x_full_88k2_via_degradation
  target_route: high_band_to_hb_target_via_mirror_detection
  strict_route_validation: true

cache:
  enabled: true
  max_items: 128
