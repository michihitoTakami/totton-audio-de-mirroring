num_samples: 10000
source_sample_rate: 44100
target_sample_rate: 88200
source_duration_sec: 1.0
chunk_duration_sec: 0.25
random_chunk: true
seed: 1234

signal_sampling:
  signal_types:
    - multitone
    - sweep_linear
    - sweep_log
    - impulse_train
    - percussive
    - am_tone
    - fm_tone
    - white_noise
    - pink_noise
    - band_limited_noise
    - soft_clipped_tone
  multitone_count_range: [2, 6]
  frequency_range_hz: [40.0, 18000.0]
  sweep_start_range_hz: [20.0, 2000.0]
  sweep_end_range_hz: [5000.0, 20000.0]
  impulse_interval_range_sec: [0.005, 0.05]
  percussive_decay_range: [6.0, 20.0]
  am_carrier_range_hz: [500.0, 10000.0]
  am_mod_range_hz: [20.0, 400.0]
  am_mod_index_range: [0.2, 0.8]
  fm_carrier_range_hz: [200.0, 8000.0]
  fm_mod_range_hz: [20.0, 800.0]
  fm_mod_index_range: [1.0, 6.0]
  band_noise_low_range_hz: [200.0, 4000.0]
  band_noise_high_range_hz: [6000.0, 18000.0]
  soft_clip_drive_range: [1.2, 3.0]

augmentation:
  gain_range: [0.7, 1.0]
  polarity_flip_prob: 0.3
  noise_std_range: [0.0, 0.002]
  soft_clip_prob: 0.2
  soft_clip_drive_range: [1.2, 2.5]

degradation:
  cutoff_hz_range: [18000.0, 22000.0]
  phase_modes: [analog]
  quantization_bits: [16, 24]
  dither_modes: [none, rectangular, triangular]
  methods:
    - iir_bessel
  iir_order: 6

band_split:
  cutoff_hz: 20000.0
  sample_rate: 88200
  num_taps: 4097
  window: hamming

mirror_detection:
  cutoff_hz: 20000.0
  mirror_center_hz: null
  mirror_band_hz: [20000.0, 22050.0]
  n_fft: 2048
  hop_length: 512
  window: hann
  magnitude_threshold: 3.0
  symmetry_threshold: 0.6

hb_target:
  suppression_floor: 0.2
  energy_cap: 0.001
  envelope_min: 0.2

cache:
  enabled: true
  max_items: 128
